name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://platform:platform@localhost:5432/platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Migrations apply and roll back
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest --cov=engine --cov-report=term-missing --cov-fail-under=90
