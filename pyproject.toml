[project]
name = "platform-monorepo"
version = "0.0.0"
description = "Platform — торговые сигналы на H4 для криптовалют"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/engine", "apps/api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/engine", "apps/api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в комментариях и строках допустима

[tool.ruff.lint.isort]
known-first-party = ["engine", "app"]

[tool.ruff.lint.per-file-ignores]
"**/alembic/**" = ["E501", "I001"]
"**/tests/**" = ["DTZ001"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["packages/engine/engine", "apps/api/app"]

[[tool.mypy.overrides]]
module = "engine.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "apps/api/tests"]
addopts = "-q --import-mode=importlib"
