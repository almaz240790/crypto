[project]
name = "platform-api"
version = "0.1.0"
description = "Platform API: FastAPI, модели БД, миграции"
requires-python = ">=3.12"
dependencies = [
    "engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "matplotlib>=3.9",
    "redis>=5.2",
    "websockets>=13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pywebpush>=2.0",
    "sentry-sdk[fastapi]>=2.0",
    "anthropic>=1.0",
]

[tool.uv.sources]
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
