[project]
name = "engine"
version = "0.1.0"
description = "Сигнальный движок Platform: структура рынка, зоны, фильтры, скоринг, бэктест"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
